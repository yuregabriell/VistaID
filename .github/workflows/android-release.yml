name: Android APK - Vista ID
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    name: Build and publish local preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare release asset
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VistaID-v0.1.0-local-debug.apk
          cd dist
          sha256sum VistaID-v0.1.0-local-debug.apk > SHA256SUMS.txt
      - name: APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VistaID-v0.1.0-local-APK
          path: dist/
          retention-days: 30
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.1.0-local
          NOTES='Vista ID local preview: on-device profiles, 13-character identity, password authentication and encrypted JSON backups. Not an online account; no device syncing or integration with other Vista apps. Debug-signed preview.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/VistaID-v0.1.0-local-debug.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/VistaID-v0.1.0-local-debug.apk dist/SHA256SUMS.txt \
              --target "${GITHUB_SHA}" --title 'Vista ID v0.1.0 - local preview' \
              --notes "$NOTES" --prerelease
          fi
